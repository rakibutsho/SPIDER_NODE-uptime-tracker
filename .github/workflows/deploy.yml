name: Deploy UptimeTracker to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Create .env file for Build
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node -e '
            const fs = require("fs");
            let envContent = process.env.ENV_FILE || "";

            // If DATABASE_URL secret is provided in GitHub Actions, override or append it
            if (process.env.DATABASE_URL) {
              let dbUrl = process.env.DATABASE_URL.trim();
              if (dbUrl.startsWith("DATABASE_URL=")) {
                dbUrl = dbUrl.slice("DATABASE_URL=".length).trim();
              }
              if ((dbUrl.startsWith("\"") && dbUrl.endsWith("\"")) || (dbUrl.startsWith("\x27") && dbUrl.endsWith("\x27"))) {
                dbUrl = dbUrl.slice(1, -1);
              }

              if (/^DATABASE_URL=/m.test(envContent)) {
                envContent = envContent.replace(/^DATABASE_URL=.*$/m, `DATABASE_URL="${dbUrl}"`);
              } else {
                envContent += (envContent ? "\n" : "") + `DATABASE_URL="${dbUrl}"\n`;
              }
            }

            fs.writeFileSync(".env", envContent);

            const match = envContent.match(/^DATABASE_URL=.*$/m);
            if (match) {
              const masked = match[0].replace(/:\/\/[^@]*@/, "://***@");
              console.log("Configured Database in CI:", masked);
            } else {
              console.log("WARNING: No DATABASE_URL found in .env!");
            }
          '

      - name: Build Next.js App
        run: npm run build

      - name: Tar Build Artifacts
        run: tar -czf deploy.tar.gz .next public package.json package-lock.json prisma ecosystem.config.js .env .npmrc

      - name: Copy Archive to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "/tmp"

      - name: Extract and Deploy on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            echo "--- Loading NVM ---"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo "--- Navigating to directory ---"
            cd /var/www/uptime-tracker
            
            echo "--- Clearing old Next.js build ---"
            rm -rf .next
            
            echo "--- Extracting new build ---"
            tar -xzf /tmp/deploy.tar.gz -C /var/www/uptime-tracker
            rm /tmp/deploy.tar.gz
            
            echo "--- Installing dependencies ---"
            npm install --omit=dev --no-audit --no-fund --legacy-peer-deps
            
            echo "--- Generating Prisma Client ---"
            npx prisma generate
            
            echo "--- Pushing Schema to DB ---"
            npx prisma db push --accept-data-loss
            
            echo "--- Restarting PM2 ---"
            pm2 restart uptime-tracker --update-env || pm2 start ecosystem.config.js
            echo "--- Deployment Complete ---"
