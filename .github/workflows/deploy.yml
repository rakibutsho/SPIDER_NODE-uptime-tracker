name: Deploy UptimeTracker to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Create .env file for Build
        run: |
          cat << 'EOF' > .env
          ${{ secrets.ENV_FILE }}
          EOF

      - name: Build Next.js App
        run: npm run build

      - name: Tar Build Artifacts
        run: tar -czf deploy.tar.gz .next public package.json package-lock.json prisma ecosystem.config.js .env

      - name: Copy Archive to VPS via SCP
        uses: appleboy/scp-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "/tmp"

      - name: Extract and Deploy on VPS
        uses: appleboy/ssh-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            echo "--- Loading NVM ---"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo "--- Navigating to directory ---"
            cd /var/www/uptime-tracker
            
            echo "--- Clearing old Next.js build ---"
            rm -rf .next
            
            echo "--- Extracting new build ---"
            tar -xzf /tmp/deploy.tar.gz -C /var/www/uptime-tracker
            rm /tmp/deploy.tar.gz
            
            echo "--- Installing dependencies (this may take a few minutes on small servers) ---"
            npm ci --omit=dev --no-audit --no-fund
            
            echo "--- Generating Prisma Client ---"
            npx prisma generate
            
            echo "--- Pushing Schema to DB ---"
            npx prisma db push --accept-data-loss
            
            echo "--- Restarting PM2 ---"
            pm2 start ecosystem.config.js
            echo "--- Deployment Complete ---"
