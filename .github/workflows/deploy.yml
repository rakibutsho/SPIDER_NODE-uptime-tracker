name: Deploy UptimeTracker to VPS

on:
  push:
    branches:
      - main
      - polishing

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js App
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run build

      - name: Zip Build Artifacts
        run: zip -r deploy.zip .next public package.json package-lock.json prisma

      - name: Copy Zip to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy.zip"
          target: "/tmp"

      - name: Extract and Deploy on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Create backup and clear old files
            cd /var/www/uptime-tracker
            
            # Unzip new build, overwriting old files
            unzip -o /tmp/deploy.zip -d /var/www/uptime-tracker
            rm /tmp/deploy.zip
            
            # Install strictly production dependencies to save RAM
            npm ci --omit=dev
            
            # Generate Prisma Client for the VPS OS architecture
            npx prisma generate
            
            # Restart PM2
            pm2 restart spidernode || pm2 start npm --name "spidernode" -- start
